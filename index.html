<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FINWISE Financial Hub Co.</title>
<meta name="theme-color" content="#0B1F3B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FINWISE">
<meta name="description" content="Think Finance. Think FINWISE. Personal and business finance planning.">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= styles.css ============================= */
:root{
  --navy:#0B1F3B;
  --navy-2:#12284C;
  --blue:#2F6FED;
  --blue-dark:#1E4FBF;
  --blue-light:#E9F1FE;
  --ink:#16233F;
  --gray:#5B6B85;
  --gray-light:#94A3B8;
  --bg:#F1F4F9;
  --surface:#FFFFFF;
  --border:#E1E7F0;
  --green:#146B3F;
  --green-bg:#E7F6EE;
  --red:#C4291C;
  --red-bg:#FCEAE8;
  --amber:#B4680A;
  --amber-bg:#FDF1DF;
  --radius:12px;
  --shadow:0 1px 2px rgba(11,31,59,.06), 0 6px 20px rgba(11,31,59,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;color:var(--navy);margin:0}
.num, .money, input, select, textarea{font-variant-numeric: tabular-nums;}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--blue-light)}

/* Layout */
#app{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex-shrink:0;background:var(--navy);
  color:#DCE6FA;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-name{font-family:'Sora';font-weight:800;font-size:19px;color:#fff;letter-spacing:.3px}
.brand-dot{color:var(--blue)}
.brand-tag{font-size:11px;color:#9FB3D6;margin-top:4px;font-style:italic}
.nav-group{padding:10px 10px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#7288AD;padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  font-size:13.5px;color:#C9D7F0;cursor:pointer;margin:1px 0;position:relative;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.nav-item .lock-ico{margin-left:auto;font-size:11px;opacity:.7}
.nav-icon{width:18px;text-align:center;font-size:14px}
.plan-pill{
  margin:14px 16px;padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  font-size:12px;color:#C9D7F0;
}
.plan-pill b{color:#fff;display:block;font-size:13px;margin-bottom:2px}

.main{flex:1;min-width:0}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--gray);font-size:12.5px;margin-top:2px}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:16px}
.content{padding:26px 28px 60px;max-width:1180px}

/* Cards */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);
}
.stat-card .label{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat-card .value{font-family:'IBM Plex Mono';font-size:24px;font-weight:600;color:var(--navy);margin-top:6px}
.stat-card .foot{font-size:11.5px;color:var(--gray-light);margin-top:4px}
.stat-card.accent-blue{border-top:3px solid var(--blue)}
.stat-card.accent-green{border-top:3px solid var(--green)}
.stat-card.accent-red{border-top:3px solid var(--red)}
.stat-card.accent-navy{border-top:3px solid var(--navy)}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.section-title h2{font-size:16px}
.rule{height:1px;background:linear-gradient(90deg,var(--border),transparent);margin-top:6px}

/* Forms */
label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:5px}
.field{margin-bottom:14px}
.help{font-size:11.5px;color:var(--gray);margin-top:4px}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=password],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px;font-family:inherit}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;
  border:none;font-weight:600;font-size:13.5px;background:var(--blue);color:#fff;
}
.btn:hover{background:var(--blue-dark)}
.btn.secondary{background:var(--surface);color:var(--navy);border:1px solid var(--border)}
.btn.secondary:hover{background:var(--blue-light)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.ghost{background:none;color:var(--blue);padding:6px 8px}
.btn.small{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error-msg{color:var(--red);font-size:12.5px;margin-top:6px;font-weight:600}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);
  padding:8px 10px;border-bottom:2px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--blue-light);color:var(--blue-dark);font-weight:600}
.empty-row{text-align:center;color:var(--gray);padding:24px;font-size:13px}

/* Progress bar */
.progress-wrap{background:#EAEFF7;border-radius:20px;height:12px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),#5FA0FF);border-radius:20px;transition:width .4s ease}
.progress-fill.green{background:linear-gradient(90deg,var(--green),#3FBE7E)}

/* Result banner */
.result-box{margin-top:16px;padding:16px 18px;border-radius:10px;background:var(--blue-light);border:1px solid #CFE1FD}
.result-box.profit{background:var(--green-bg);border-color:#BEE7CF}
.result-box.loss{background:var(--red-bg);border-color:#F5C9C4}
.result-box .big{font-family:'IBM Plex Mono';font-size:26px;font-weight:700;color:var(--navy)}
.result-box .big.profit{color:var(--green)}
.result-box .big.loss{color:var(--red)}
.result-line{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--gray)}
.result-line b{color:var(--ink);font-family:'IBM Plex Mono'}

/* Education cards */
.lesson-card{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease}
.lesson-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,31,59,.1)}
.lesson-icon{font-size:24px}
.lesson-body{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:13.5px;line-height:1.6;color:var(--ink)}
.lesson-body.open{display:block}
.lesson-body ul{margin:8px 0;padding-left:20px}

/* Steps */
.step-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}
.step-check.done{background:var(--green);border-color:var(--green)}
.step-title{font-weight:600;font-size:14px}
.step-title.done{text-decoration:line-through;color:var(--gray-light)}
.step-desc{font-size:12.5px;color:var(--gray);margin-top:2px}

/* Pricing */
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.plan-card.current{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset, var(--shadow)}
.plan-card.expired{border-color:var(--red)}
.plan-card .pname{font-family:'Sora';font-weight:700;font-size:16px;color:var(--navy)}
.plan-card .pprice{font-family:'IBM Plex Mono';font-size:24px;font-weight:700;margin:8px 0 2px}
.plan-card .pperiod{font-size:11.5px;color:var(--gray)}
.plan-card .pdesc{font-size:12.5px;color:var(--gray);line-height:1.55;margin:12px 0;flex:1}
.badge-current{align-self:flex-start;background:var(--green-bg);color:var(--green);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.badge-expired{align-self:flex-start;background:var(--red-bg);color:var(--red);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}

/* Lock overlay */
.locked-card{padding:40px 30px;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
.locked-card .lk{font-size:34px}
.locked-card h3{margin-top:10px}
.locked-card p{color:var(--gray);font-size:13.5px;max-width:440px;margin:8px auto 18px;line-height:1.6}
.plan-chip{display:inline-block;background:var(--blue-light);color:var(--blue-dark);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;margin:2px}

/* Toast */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);animation:slidein .25s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

.footer-disclaimer{margin-top:40px;padding:16px 18px;background:var(--blue-light);border-radius:10px;font-size:11.5px;color:var(--navy-2);line-height:1.6}

.quick-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--navy)}
.quick-btn:hover{background:var(--blue-light);border-color:var(--blue)}

/* Auth screen */
.auth-shell{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%, #12294D 0%, #0B1F3B 55%, #081527 100%);padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;padding:30px 28px 26px;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-brand{text-align:center;margin-bottom:6px}
.auth-brand .brand-name{font-family:'Sora';font-weight:800;font-size:24px;color:var(--navy)}
.auth-brand .brand-tag{font-size:12px;color:var(--gray);font-style:italic;margin-top:2px}
.auth-tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin:22px 0 20px}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:8px;border:none;background:none;
  font-family:inherit;font-weight:600;font-size:13px;color:var(--gray);cursor:pointer}
.auth-tab.active{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(11,31,59,.15)}
.auth-guest{text-align:center;margin-top:16px;font-size:12.5px;color:var(--gray)}
.auth-guest button{background:none;border:none;color:var(--blue);font-weight:600;font-family:inherit;cursor:pointer;padding:0}
.auth-note{font-size:11px;color:var(--gray);text-align:center;margin-top:18px;line-height:1.6}
.auth-switch{text-align:center;font-size:12.5px;color:var(--gray);margin-top:14px}
.auth-switch button{background:none;border:none;color:var(--blue);font-weight:600;font-family:inherit;cursor:pointer;padding:0}

/* Terms and conditions */
.terms-row{display:flex;align-items:flex-start;gap:8px;margin:4px 0 2px;font-size:12.5px;color:var(--gray);line-height:1.5}
.terms-row input[type=checkbox]{width:16px;height:16px;margin-top:1px;flex-shrink:0;accent-color:var(--blue);cursor:pointer}
.terms-row .terms-link{background:none;border:none;color:var(--blue);font-weight:600;font-size:12.5px;
  font-family:inherit;cursor:pointer;padding:0;text-decoration:underline}
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,59,.55);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:20px}
.modal-overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;max-height:80vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.modal-close{background:none;border:none;font-size:18px;color:var(--gray);cursor:pointer}
.modal-body{padding:16px 20px;overflow-y:auto;font-size:12.5px;color:var(--ink);line-height:1.65}
.modal-body h4{font-size:13px;margin:14px 0 4px}
.modal-body h4:first-child{margin-top:0}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* Sidebar profile */
.profile-block{margin:12px 16px 0;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.profile-info{min-width:0;flex:1}
.profile-name{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-email{font-size:10.5px;color:#9FB3D6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:none;border:none;color:#9FB3D6;font-size:15px;cursor:pointer;flex-shrink:0}
.logout-btn:hover{color:#fff}

@media (max-width:980px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .plans-grid{grid-template-columns:1fr}
}
/* Install button */
.install-btn{display:none;align-items:center;gap:6px}
.install-btn.show{display:inline-flex}

/* Bottom app nav (mobile) */
.bottom-nav{display:none}
.sidebar-backdrop{display:none}

@media (max-width:760px){
  .sidebar{position:fixed;left:-260px;z-index:30;transition:left .2s ease;box-shadow:4px 0 20px rgba(0,0,0,.25);
    padding-top:env(safe-area-inset-top)}
  .sidebar.open{left:0}
  .sidebar-backdrop.open{display:block;position:fixed;inset:0;background:rgba(11,31,59,.35);z-index:25}
  .hamburger{display:inline-block}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .content{padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
  .topbar{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .btn.secondary.small[data-nav="subscription"]{display:none}
  #save-indicator{display:none}

  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(11,31,59,.08);
  }
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;background:none;border:none;font-family:inherit;
    font-size:10px;color:var(--gray-light);
  }
  .bottom-nav-item .bn-icon{font-size:19px;line-height:1}
  .bottom-nav-item.active{color:var(--blue);font-weight:700}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<script>
/* ============================= app.js ============================= */

/* ============================= DATA / CONSTANTS ============================= */

const STORAGE_KEY = 'finwise-state-v1';

const defaultState = () => ({
  budgeting: { income:'', savings:'', spendingLimit:'' },
  expenses: [],
  savingsPlanner: { goal:'', current:'', monthly:'' },
  businessSteps: Array(9).fill(false),
  businessBudget: { revenue:'', expenses:'' },
  startupCosts: { equipment:'', furniture:'', leasehold:'', registration:'', supplies:'', marketing:'', other:'' },
  pnl: { revenue:'', cost:'', opex:'' },
  breakEven: { fixed:'', price:'', variable:'' },
  goals: [],
  templates: {},
  consultations: [],
  // New users start with NO active plan: planId is null so the "No active plan"
  // state is shown and tools unlock only after the user subscribes.
  subscription: { planId: null, cycle: 'yearly', subscribedAt: null, expiresAt: null, cancelled: false },
  meta: { lessonOpen:null }
});

let state = defaultState();
let stateLoaded = false;

const EXPENSE_CATEGORIES = ['Food','Transportation','Utilities','Education','Business','Other'];

const BUSINESS_STEPS = [
  {t:'Choose and validate a business idea', d:'Test your idea against a real need in the market before committing money.'},
  {t:'Identify target customers', d:'Define who will actually buy from you — age, needs, income, location.'},
  {t:'Analyze competitors', d:'Study who else offers something similar and how you will stand out.'},
  {t:'Estimate start-up costs', d:'List everything you need to spend before you open your doors.'},
  {t:'Prepare a business plan', d:'Write down your concept, market, operations, and goals in one document.'},
  {t:'Prepare a financial plan', d:'Project your revenue, expenses, and break-even point.'},
  {t:'Check registration and permit requirements', d:'Confirm DTI/SEC, BIR, and local permits needed for your business type.'},
  {t:'Set up records and financial monitoring', d:'Decide how you will track income, expenses, and cash flow from day one.'},
  {t:'Prepare marketing strategies', d:'Plan how customers will find out about you and why they should choose you.'}
];

const LESSONS = [
  {id:'l1', icon:'📊', title:'Budgeting Basics', summary:'Give every peso a job before the month begins.',
   body:`<p>A budget is simply a plan for your money before you spend it. The most common approach is the <b>50/30/20 rule</b>: 50% of income for needs (rent, food, utilities), 30% for wants (leisure, dining out), and 20% for savings and debt repayment.</p>
   <ul><li>Start by listing your actual monthly income after tax.</li><li>List fixed expenses first (rent, loan payments), then variable ones (food, transport).</li><li>Review your budget monthly — it should change as your life does.</li></ul>`},
  {id:'l2', icon:'🛟', title:'Savings and Emergency Funds', summary:'Build a cushion before you build wealth.',
   body:`<p>An emergency fund is money set aside only for real emergencies — job loss, medical bills, urgent repairs. Most experts suggest saving <b>3 to 6 months</b> of essential expenses.</p>
   <ul><li>Keep it in a separate, easily accessible savings account.</li><li>Start small — even ₱500 a month builds momentum.</li><li>Rebuild it immediately after you use it.</li></ul>`},
  {id:'l3', icon:'🛒', title:'Smart Spending', summary:'Spend on purpose, not on impulse.',
   body:`<p>Smart spending means matching your purchases to your actual priorities and values, not to advertising or peer pressure.</p>
   <ul><li>Use the 24-hour rule for non-essential purchases over a set amount.</li><li>Track where your money actually goes for one month — it's often surprising.</li><li>Compare prices and consider needs versus wants before buying.</li></ul>`},
  {id:'l4', icon:'💳', title:'Debt Awareness', summary:'Understand debt before it controls you.',
   body:`<p>Not all debt is bad — a loan for education or a home can build your future. The danger is high-interest, unplanned debt like credit card balances that roll over.</p>
   <ul><li>Always know your interest rate and minimum payment.</li><li>Pay more than the minimum whenever possible to reduce interest paid.</li><li>Avoid borrowing to cover recurring living expenses — that's a warning sign.</li></ul>`},
  {id:'l5', icon:'🏢', title:'Basic Business Finance', summary:'Separate your business money from your personal money.',
   body:`<p>Every business, no matter how small, needs to track money in (revenue) and money out (expenses) separately from personal finances.</p>
   <ul><li>Open a separate account or wallet for the business as soon as possible.</li><li>Record every transaction, even small ones — they add up.</li><li>Know your break-even point: the sales level where you stop losing money.</li></ul>`},

const USERS_KEY = 'finwise-users-v1';
const SESSION_KEY = 'finwise-session-v1';
const GUEST_STATE_KEY = STORAGE_KEY; // legacy single-user key, reused for guest sessions

/* localStorage-backed persistence adapter (async API) */
window.storage = {
  async get(key){
    try{
      const v = localStorage.getItem(key);
      return (v === null) ? null : { value: v };
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); return true; }
    catch(e){ throw e; }
  },
  async delete(key){
    try{ localStorage.removeItem(key); return true; }catch(e){ return false; }
  }
};

let users = [];
let currentUser = null; // {id, name, email, guest}

function hashPass(pw){
  // Lightweight obfuscation only — this is a local demo login, not secure authentication.
  let h = 5381;
  for(let i=0;i<pw.length;i++){ h = ((h*33) ^ pw.charCodeAt(i)) >>> 0; }
  return h.toString(36) + '-' + pw.length;
}
function emailValid(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function stateKeyFor(user){ return user.guest ? GUEST_STATE_KEY : ('finwise-state-' + user.id); }

async function loadUsers(){
  try{
    const res = await window.storage.get(USERS_KEY, false);
    users = (res && res.value) ? JSON.parse(res.value) : [];
  }catch(e){ users = []; }
}
async function saveUsers(){
  try{ await window.storage.set(USERS_KEY, JSON.stringify(users), false); }
  catch(e){ toast('Could not save account data.', 'error'); }
}
async function loadSession(){
  try{
    const res = await window.storage.get(SESSION_KEY, false);
    if(res && res.value){
      const sess = JSON.parse(res.value);
      if(sess.guest){ currentUser = {id:'guest', name:'Guest', email:null, guest:true}; return; }
      const u = users.find(u=>u.id===sess.userId);
      if(u) currentUser = {id:u.id, name:u.name, email:u.email, guest:false};
    }
  }catch(e){ currentUser = null; }
}
async function saveSession(){
  try{
    const payload = currentUser.guest ? {guest:true} : {userId: currentUser.id};
    await window.storage.set(SESSION_KEY, JSON.stringify(payload), false);
  }catch(e){}
}
async function clearSession(){
  try{ await window.storage.delete(SESSION_KEY, false); }catch(e){}
}

function signUp(name, email, password){
  const exists = users.some(u=>u.email.toLowerCase()===email.toLowerCase());
  if(exists) return {ok:false, error:'An account with this email already exists. Try logging in instead.'};
  const user = {id: uid(), name, email, passHash: hashPass(password), createdAt: new Date().toISOString()};
  users.push(user);
  saveUsers();
  return {ok:true, user};
}
function logIn(email, password){
  const u = users.find(u=>u.email.toLowerCase()===email.toLowerCase());
  if(!u || u.passHash !== hashPass(password)) return {ok:false, error:'Incorrect email or password.'};
  return {ok:true, user:u};
}

async function afterAuth(user){
  currentUser = {id:user.id, name:user.name, email:user.email, guest: !!user.guest};
  await saveSession();
  await loadState();
  renderApp();
  toast(currentUser.guest ? 'Continuing as guest.' : ('Welcome, ' + currentUser.name + '.'), 'success');
}

async function logOut(){
  await flushState();          // persist any debounced changes before dropping state
  await clearSession();
  currentUser = null;
  state = defaultState();
  stateLoaded = false;
  renderAuthScreen('login');
  toast('Logged out.');
}

/* ============================= STORAGE ============================= */

async function loadState(){
  try{
    const res = await window.storage.get(stateKeyFor(currentUser), false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(defaultState(), parsed);
      // deep-merge nested defaults for safety
      state.budgeting = Object.assign(defaultState().budgeting, parsed.budgeting||{});
      state.savingsPlanner = Object.assign(defaultState().savingsPlanner, parsed.savingsPlanner||{});
      state.businessBudget = Object.assign(defaultState().businessBudget, parsed.businessBudget||{});
      state.startupCosts = Object.assign(defaultState().startupCosts, parsed.startupCosts||{});
      state.pnl = Object.assign(defaultState().pnl, parsed.pnl||{});
      state.breakEven = Object.assign(defaultState().breakEven, parsed.breakEven||{});
      state.subscription = Object.assign(defaultState().subscription, parsed.subscription||{});
      migrateSubscription(state.subscription);
      if(!Array.isArray(state.expenses)) state.expenses = [];
      if(!Array.isArray(state.goals)) state.goals = [];
      if(!Array.isArray(state.consultations)) state.consultations = [];
      if(!Array.isArray(state.businessSteps) || state.businessSteps.length!==9) state.businessSteps = Array(9).fill(false);
    }
  }catch(e){
    // no existing record yet — start fresh
    state = defaultState();
  }
  stateLoaded = true;
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  const user = currentUser;            // snapshot owner at call time
  const snapshot = JSON.stringify(state); // snapshot data at call time
  return new Promise((resolve)=>{
    saveTimer = setTimeout(async ()=>{
      try{
        await window.storage.set(stateKeyFor(user), snapshot, false);
        markSaved();
      }catch(e){
        toast('Could not save your data. Please try again.', 'error');
      }
      resolve();
    }, 500);
  });
}

/* Write any pending changes immediately (used before logout / unload). */
async function flushState(){
  if(!currentUser) return;
  clearTimeout(saveTimer);
  try{
    await window.storage.set(stateKeyFor(currentUser), JSON.stringify(state), false);
    markSaved();
  }catch(e){
    toast('Could not save your data. Please try again.', 'error');
  }
}

function markSaved(){
  const el = document.getElementById('save-indicator');
  if(el) el.textContent = '✓ Saved ' + new Date().toLocaleTimeString('en-PH', {hour:'2-digit', minute:'2-digit'});
}

/** Wires up "save as you type" for a set of inputs on the currently rendered page.
 *  fields: array of [inputId, (value)=>void] pairs. Each setter writes into `state`. */
function bindAutosave(fields){
  fields.forEach(([inputId, setter])=>{
    const el = document.getElementById(inputId);
    if(!el) return;
    el.addEventListener('input', ()=>{ setter(el.value); saveState(); });
  });
}

/* ---------- Real subscription model (subscribe / renew / cancel / expiry) ---------- */

const SUB_CYCLE_MS = { monthly: 30*24*60*60*1000, yearly: 365*24*60*60*1000 };

function planCyclePrice(plan, cycle){
  return cycle === 'monthly' ? Math.max(1, Math.round(plan.price/12)) : plan.price;
}

function migrateSubscription(sub){
  // Older saved states may lack expiry/cycle fields — give them a sane, active window.
  const now = Date.now();
  if(!sub.cycle || !SUB_CYCLE_MS[sub.cycle]) sub.cycle = 'yearly';
  if(!sub.expiresAt){
    const base = sub.subscribedAt ? new Date(sub.subscribedAt).getTime() : now;
    sub.expiresAt = new Date(Math.max(base, now) + SUB_CYCLE_MS[sub.cycle]).toISOString();
  }
  if(typeof sub.cancelled !== 'boolean') sub.cancelled = false;
}

function subscriptionActive(){
  const s = state.subscription;
  if(!s || !s.planId) return false;
  if(!s.expiresAt) return true; // legacy state without expiry stays active until migrated
  return Date.now() < new Date(s.expiresAt).getTime();
}

function subscriptionStatus(){
  const s = state.subscription || {};
  if(!s.planId) return { key:'none', label:'No active plan' };
  const plan = PLANS.find(p=>p.id===s.planId);
  const exp = s.expiresAt ? new Date(s.expiresAt) : null;
  const msLeft = exp ? exp.getTime() - Date.now() : Infinity;
  const daysLeft = isFinite(msLeft) ? Math.max(0, Math.ceil(msLeft/86400000)) : null;
  if(!subscriptionActive()){
    return { key:'expired', label:'Expired' + (exp ? ' on '+fmtShortDate(exp) : ''),
             daysLeft:0, plan, cancelled:!!s.cancelled, cycle:s.cycle, expiresAt:s.expiresAt };
  }
  return { key: s.cancelled ? 'ending' : 'active',
           label: (s.cancelled ? 'Cancels' : 'Renews') + (exp ? ' on '+fmtShortDate(exp) : ' automatically'),
           daysLeft, plan, cancelled:!!s.cancelled, cycle:s.cycle, expiresAt:s.expiresAt };
}

function fmtShortDate(d){
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function subscribe(planId, cycle){
  const plan = PLANS.find(p=>p.id===planId);
  if(!plan) return;
  const now = new Date();
  const next = cycle === 'monthly' && state.subscription.planId === planId && state.subscription.expiresAt && subscriptionActive()
    ? new Date(state.subscription.expiresAt)
    : now;
  state.subscription = {
    planId, cycle: cycle || 'yearly',
    subscribedAt: now.toISOString(),
    expiresAt: new Date(next.getTime() + SUB_CYCLE_MS[cycle || 'yearly']).toISOString(),
    cancelled: false
  };
  saveState();
}

function renewSubscription(){
  const s = state.subscription;
  if(!s.planId) return;
  const cycle = s.cycle || 'yearly';
  const base = (s.expiresAt && new Date(s.expiresAt).getTime() > Date.now())
    ? new Date(s.expiresAt) : new Date();
  s.cancelled = false;
  s.expiresAt = new Date(base.getTime() + SUB_CYCLE_MS[cycle]).toISOString();
  saveState();
}

function cancelSubscription(){
  const s = state.subscription;
  if(!s.planId) return;
  s.cancelled = true; // keeps access until the current period ends, no auto-renewal
  saveState();
}

function reactivateSubscription(){
  const s = state.subscription;
  if(!s.planId) return;
  if(subscriptionActive()){ s.cancelled = false; saveState(); }
  else renewSubscription();
}

function unlockedTools(){
  const s = state.subscription;
  if(!s || !s.planId || !subscriptionActive()) return new Set();
  const plan = PLANS.find(p=>p.id===s.planId);
  return new Set(plan ? plan.tools : []);
}
function hasAccess(toolId){
  return unlockedTools().has(toolId);
}
function plansThatInclude(toolId){
  return PLANS.filter(p=>p.tools.includes(toolId));
}

function dashboardTotals(){
  const income = num(state.budgeting.income);
  const totalExpenses = state.expenses.reduce((s,e)=>s+num(e.amount),0);
  const balance = income - totalExpenses;
  const currentSavings = num(state.savingsPlanner.current);
  const goal = num(state.savingsPlanner.goal);
  const progress = goal>0 ? Math.min(100,(currentSavings/goal)*100) : 0;
  return {income, totalExpenses, balance, currentSavings, goal, progress};
}

  if(currentUser){
    await loadState();
    renderApp();
  } else {
    renderAuthScreen('login');
  }
}

function renderApp(){
  if(!currentUser) return renderAuthScreen('login');
  const page = currentPage();
  const shellHtml = renderShell(page);
  document.getElementById('app').innerHTML = shellHtml;
  bindShellEvents();
  mountPage(page);
}

function bindShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ navigate(el.getAttribute('data-nav')); closeSidebar(); });
  });
  const ham = document.getElementById('hamburger');
  if(ham) ham.addEventListener('click', ()=> toggleSidebar());
  const more = document.getElementById('bottomMore');
  if(more) more.addEventListener('click', ()=> toggleSidebar());
  const backdrop = document.getElementById('sidebarBackdrop');
  if(backdrop) backdrop.addEventListener('click', ()=> closeSidebar());
  const installBtn = document.getElementById('install-btn');
  if(installBtn) bindInstallButton(installBtn);
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', logOut);
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

function lockedCardHtml(toolId){
  const meta = TOOLS_META[toolId];

  return `<div class="locked-card">

/* ============================= PAGE MOUNTING ============================= */

function mountPage(page){
  const c = document.getElementById('content');
  const guardedPages = Object.keys(TOOLS_META);
  if(guardedPages.includes(page) && !hasAccess(page)){
    c.innerHTML = lockedCardHtml(page);
    c.querySelectorAll('[data-nav]').forEach(el=> el.addEventListener('click', ()=>navigate(el.getAttribute('data-nav'))));
    return;
  }
  const renderers = {
    dashboard: renderDashboard,
    budgeting: renderBudgeting,
    expenses: renderExpenses,
    savings: renderSavings,
    goals: renderGoals,
    education: renderEducation,
    'business-guide': renderBusinessGuide,
    'business-budget': renderBusinessBudget,
    'startup-cost': renderStartupCost,
    pnl: renderPnl,
    breakeven: renderBreakeven,
    templates: renderTemplates,
    reports: renderReports,
    subscription: renderSubscription,
    support: renderSupport,
  };
  (renderers[page] || renderDashboard)();
}

function renderBudgeting(){

        <div class="field"><label>Planned Savings</label><input type="number" id="bg-savings" min="0" placeholder="e.g. 3000" value="${esc(b.savings)}"></div>
        <div class="field"><label>Spending Limit</label><input type="number" id="bg-limit" min="0" placeholder="e.g. 18000" value="${esc(b.spendingLimit)}"></div>
        <div id="bg-error"></div>
        <button class="btn" id="bg-calc">Calculate Budget</button>
      </div>
      <div>
        <div class="card" id="bg-result">
          <h3 style="margin-bottom:10px">Result</h3>
          <p style="color:var(--gray);font-size:13.5px">Enter your numbers and press Calculate to see your available and remaining budget in Philippine Peso.</p>
        </div>
      </div>
    </div>
  `;
  bindAutosave([
    ['bg-income', v=> state.budgeting.income = v],
    ['bg-savings', v=> state.budgeting.savings = v],
    ['bg-limit', v=> state.budgeting.spendingLimit = v],
  ]);
  document.getElementById('bg-calc').addEventListener('click', ()=>{
    const income = num(val('bg-income')), savings = num(val('bg-savings')), limit = num(val('bg-limit'));
    const errBox = document.getElementById('bg-error');
    if(val('bg-income')==='' || income<=0){ errBox.innerHTML = `<div class="error-msg">Please enter a valid monthly income greater than 0.</div>`; return; }
    errBox.innerHTML = '';
    const available = income - savings;
    const remaining = available - limit;
    state.budgeting = { income: val('bg-income'), savings: val('bg-savings'), spendingLimit: val('bg-limit') };
    saveState();
    document.getElementById('bg-result').innerHTML = `
      <h3 style="margin-bottom:10px">Result</h3>
      <div class="result-box ${remaining<0?'loss':'profit'}">
        <div class="result-line"><span>Available Budget (Income − Savings)</span><b>${peso(available)}</b></div>

      </div>`;
    toast('Budget calculated and saved.', 'success');
    renderDashboardSilently();
  });
}

      </div>
    </div>
  `;
  bindAutosave([
    ['be-fixed', v=> state.breakEven.fixed = v],
    ['be-price', v=> state.breakEven.price = v],
    ['be-var', v=> state.breakEven.variable = v],
  ]);
  document.getElementById('be-calc').addEventListener('click', ()=>{
    const fixed = num(val('be-fixed')), price = num(val('be-price')), variable = num(val('be-var'));
    const err = document.getElementById('be-error');

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function makeIcon(size){
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0B1F3B';
  roundRectPath(ctx, 0, 0, size, size, size*0.22); ctx.fill();
  ctx.fillStyle = '#2F6FED';
  ctx.beginPath(); ctx.arc(size*0.775, size*0.235, size*0.085, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = "700 " + Math.round(size*0.52) + "px 'Sora', sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('F', size*0.44, size*0.565);
  return cv.toDataURL('image/png');
}

let deferredInstallPrompt = null;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function bindInstallButton(btn){
  if(isStandalone()){ btn.classList.remove('show'); return; }
  if(deferredInstallPrompt) btn.classList.add('show');
  btn.addEventListener('click', async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.classList.remove('show');
      if(choice && choice.outcome === 'accepted') toast('FINWISE installed.', 'success');
    } else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
      toast('On iPhone/iPad: tap Share, then "Add to Home Screen".');
    } else {
      toast('Open your browser menu and choose "Install app" or "Add to Home Screen".');
    }
  });
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-btn');
  if(btn) btn.classList.add('show');
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  toast('FINWISE installed.', 'success');
});

      theme_color: '#0B1F3B',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    let link = document.createElement('link'); link.rel = 'manifest'; link.href = manifestUrl; document.head.appendChild(link);
    let appleIcon = document.createElement('link'); appleIcon.rel = 'apple-touch-icon'; appleIcon.href = icon192; document.head.appendChild(appleIcon);
    let favicon = document.createElement('link'); favicon.rel = 'icon'; favicon.type='image/png'; favicon.href = icon192; document.head.appendChild(favicon);
  }catch(e){ /* icon/manifest generation is a non-critical enhancement */ }

  try{
    if('serviceWorker' in navigator){
      const swSource = "self.addEventListener('install',e=>self.skipWaiting());" +
        "self.addEventListener('activate',e=>self.clients.claim());" +
        "self.addEventListener('fetch',e=>{});";
      const swUrl = URL.createObjectURL(new Blob([swSource], {type:'application/javascript'}));
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  }catch(e){ /* offline support is a non-critical enhancement */ }
}

/* ============================= INIT ============================= */
setupPWA();
boot();
</script>
